<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- head.svg: anchor = base do pescoço (50, 92), tip = topo da cabeça (50, 12) -->
  <!-- Tokens: #FF00FF = corpo principal, #00FFFF = detalhe/sombra -->
  <circle cx="50" cy="48" r="36" fill="#FF00FF" />
  <path d="M 30 74 Q 50 86 70 74" fill="none" stroke="#00FFFF" stroke-width="4" stroke-linecap="round" />

  <!-- Guias de referência (remova ou oculte antes de exportar para public/assets/) -->
  <g id="reference-markers" opacity="0.6">
    <!-- anchor (50, 92) -->
    <circle cx="50" cy="92" r="3" fill="#00C853" />
    <!-- tip (50, 12) -->
    <circle cx="50" cy="12" r="3" fill="#FF9100" />
  </g>
</svg>
